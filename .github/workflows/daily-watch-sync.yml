name: Daily watch release sync
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_releases.py'
      - '.github/workflows/daily-watch-sync.yml'
  schedule:
    - cron: '0 13 * * *' # 21:00 Singapore time daily (UTC+8)
permissions:
  contents: write
concurrency:
  group: watch-release-sync
  cancel-in-progress: true
jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install -r requirements.txt
      - name: Collect official release listings and recover model images
        run: python scripts/update_releases.py
      - name: Commit changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/releases.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official watch release feed'
            # A manual feed/documentation change can land while scraping. Retry
            # on the latest main; if only the generated feed conflicts, preserve
            # the freshly scraped feed and continue the rebase automatically.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  exit 0
                fi
              else
                if git diff --name-only --diff-filter=U | grep -qx 'data/releases.json'; then
                  git checkout --theirs -- data/releases.json
                  git add data/releases.json
                  if GIT_EDITOR=true git rebase --continue; then
                    if git push origin HEAD:main; then
                      exit 0
                    fi
                  else
                    git rebase --abort || true
                    echo "Rebase could not continue after resolving the generated feed conflict." >&2
                    exit 1
                  fi
                else
                  git rebase --abort || true
                  echo "Rebase conflict outside the generated feed; stopping for manual review." >&2
                  exit 1
                fi
              fi
              echo "Push attempt $attempt failed; retrying after fetching main."
              sleep 2
            done
            echo "Unable to publish refreshed feed after 5 attempts." >&2
            exit 1
          else
            echo 'No feed changes to commit.'
          fi
