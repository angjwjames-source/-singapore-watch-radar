name: Daily watch release sync
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_releases.py'
      - '.github/workflows/daily-watch-sync.yml'
  schedule:
    - cron: '15 1 * * *' # 09:15 Singapore time daily
permissions:
  contents: write
concurrency:
  group: watch-release-sync
  cancel-in-progress: false
jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install -r requirements.txt
      - name: Collect official release listings and recover model images
        run: python scripts/update_releases.py
      - name: Commit changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/releases.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official watch release feed'
            # Another workflow or a manual change may update main while scraping.
            # Rebase onto the latest main and retry the push instead of failing
            # with a non-fast-forward rejection.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Rebase conflict while publishing refreshed feed." >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after fetching main."
              sleep 2
            done
            echo "Unable to publish refreshed feed after 5 attempts." >&2
            exit 1
          else
            echo 'No feed changes to commit.'
          fi
