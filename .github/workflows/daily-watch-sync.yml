name: Daily watch release sync
on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *' # 09:15 Singapore time daily
permissions:
  contents: write
concurrency:
  group: watch-release-sync
  cancel-in-progress: false
jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install -r requirements.txt
      - name: Collect official release listings
        run: python scripts/update_releases.py
      - name: Commit changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/releases.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official watch release feed'
            git push
          else
            echo 'No feed changes to commit.'
          fi
